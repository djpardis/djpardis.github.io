<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Simplified key lime reranker architecture</title>
  <desc id="desc">Chroma frames and DSP key scores feed a compact reranker. The model adds learned chroma corrections to DSP scores, then chooses the largest adjusted key score.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a403a"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#fffaf2"/>

  <rect x="70" y="80" width="260" height="120" rx="18" fill="#eef3e4" stroke="#7a8f5a" stroke-width="4"/>
  <text x="200" y="125" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="29" font-weight="700" fill="#4a332f">Chroma frames</text>
  <text x="200" y="162" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">pitch-class energy</text>
  <text x="200" y="190" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">over time</text>

  <rect x="70" y="320" width="260" height="120" rx="18" fill="#f5ecdc" stroke="#d7c6b2" stroke-width="4"/>
  <text x="200" y="365" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="29" font-weight="700" fill="#4a332f">DSP key scores</text>
  <text x="200" y="402" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">24 candidate</text>
  <text x="200" y="430" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">key scores</text>

  <line x1="340" y1="140" x2="445" y2="140" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="340" y1="380" x2="445" y2="380" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="455" y="80" width="300" height="120" rx="18" fill="#fff" stroke="#7a8f5a" stroke-width="4"/>
  <text x="605" y="124" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700" fill="#4a332f">Compact transformer</text>
  <text x="605" y="162" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">learns when chroma</text>
  <text x="605" y="190" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">changes the ranking</text>

  <rect x="455" y="320" width="300" height="120" rx="18" fill="#fff" stroke="#d7c6b2" stroke-width="4"/>
  <text x="605" y="365" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700" fill="#4a332f">DSP score branch</text>
  <text x="605" y="402" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">keeps the original</text>
  <text x="605" y="430" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">DSP ranking available</text>

  <line x1="765" y1="140" x2="855" y2="230" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="765" y1="380" x2="855" y2="290" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="865" y="205" width="250" height="115" rx="18" fill="#f2d8df" stroke="#b74a63" stroke-width="4"/>
  <text x="990" y="248" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700" fill="#4a332f">Add scores</text>
  <text x="990" y="285" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">24 adjusted key scores</text>

  <line x1="990" y1="325" x2="990" y2="385" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="865" y="395" width="250" height="80" rx="18" fill="#f5ecdc" stroke="#b74a63" stroke-width="4"/>
  <text x="990" y="430" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700" fill="#4a332f">Pick largest score</text>
  <text x="990" y="460" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="21" font-weight="600" fill="#4a332f">global key</text>

  <text x="605" y="260" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="700" fill="#4a332f">21,528 trainable parameters</text>
</svg>
