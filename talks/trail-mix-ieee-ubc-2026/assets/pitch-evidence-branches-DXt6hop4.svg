<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Pitch evidence branches</title>
  <desc id="desc">A windowed frame is measured by Goertzel target checks and a CQT note-spaced frequency ladder. Both produce pitch-frequency energy for chroma folding.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a403a"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#fffaf2"/>

  <text x="70" y="62" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="700" fill="#4a332f">Windowed audio frame</text>
  <rect x="70" y="95" width="250" height="110" rx="18" fill="#f2d8df" stroke="#b74a63" stroke-width="4"/>
  <path d="M92 150 C117 110 147 190 172 150 C197 110 227 190 252 150 C277 110 302 185 318 150" fill="none" stroke="#5a403a" stroke-width="6" stroke-linecap="round"/>
  <text x="195" y="245" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="600" fill="#4a332f">one short slice of audio</text>

  <line x1="330" y1="150" x2="440" y2="150" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="390" y1="150" x2="440" y2="315" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="455" y="75" width="320" height="165" rx="20" fill="#fff" stroke="#b74a63" stroke-width="4"/>
  <text x="485" y="115" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700" fill="#4a332f">Goertzel</text>
  <text x="485" y="145" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">checks a few</text>
  <text x="485" y="173" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">exact notes</text>
  <line x1="510" y1="200" x2="720" y2="200" stroke="#d7c6b2" stroke-width="4"/>
  <g font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="700" fill="#4a332f" text-anchor="middle">
    <line x1="535" y1="185" x2="535" y2="215" stroke="#b74a63" stroke-width="6"/>
    <text x="535" y="235">A</text>
    <line x1="600" y1="178" x2="600" y2="222" stroke="#b74a63" stroke-width="6"/>
    <text x="600" y="235">C#</text>
    <line x1="665" y1="185" x2="665" y2="215" stroke="#b74a63" stroke-width="6"/>
    <text x="665" y="235">E</text>
    <line x1="715" y1="190" x2="715" y2="210" stroke="#b74a63" stroke-width="5"/>
    <text x="715" y="235">2f</text>
  </g>

  <rect x="455" y="285" width="320" height="165" rx="20" fill="#fff" stroke="#597da8" stroke-width="4"/>
  <text x="485" y="325" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700" fill="#4a332f">CQT</text>
  <text x="485" y="355" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">maps energy</text>
  <text x="485" y="383" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" fill="#4a332f">across many notes</text>
  <g font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="700" fill="#4a332f" text-anchor="middle">
    <rect x="505" y="398" width="34" height="35" rx="7" fill="#dfe9f4" stroke="#597da8" stroke-width="3"/>
    <text x="522" y="423">C</text>
    <rect x="545" y="398" width="34" height="35" rx="7" fill="#dfe9f4" stroke="#597da8" stroke-width="3"/>
    <text x="562" y="423">C#</text>
    <rect x="585" y="398" width="34" height="35" rx="7" fill="#dfe9f4" stroke="#597da8" stroke-width="3"/>
    <text x="602" y="423">D</text>
    <rect x="625" y="398" width="34" height="35" rx="7" fill="#dfe9f4" stroke="#597da8" stroke-width="3"/>
    <text x="642" y="423">D#</text>
    <rect x="665" y="398" width="34" height="35" rx="7" fill="#dfe9f4" stroke="#597da8" stroke-width="3"/>
    <text x="682" y="423">E</text>
    <text x="725" y="423" font-size="26">...</text>
  </g>

  <line x1="780" y1="157" x2="875" y2="225" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="780" y1="365" x2="875" y2="295" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="885" y="205" width="245" height="120" rx="20" fill="#f5ecdc" stroke="#d7c6b2" stroke-width="4"/>
  <text x="1008" y="245" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="27" font-weight="700" fill="#4a332f">note energy</text>
  <text x="1008" y="280" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="27" font-weight="700" fill="#4a332f">estimates</text>

  <line x1="1008" y1="330" x2="1008" y2="410" stroke="#5a403a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1008" y="455" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="600" fill="#4a332f">next: fold octaves into 12 chroma values</text>
</svg>
