<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"
  aria-label="Two stacked panels sharing a time axis. The top panel is the audio: mostly quiet, with two loud bursts where new sounds start. The bottom panel is the onset-strength curve, which is low most of the time and spikes into a tall peak under each burst. Dashed guides connect each burst in the audio to its peak in the onset curve, showing that a new sound is a jump in energy that becomes a peak.">
